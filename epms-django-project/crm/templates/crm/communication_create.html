{% extends "base.html" %}
{% block title %}Log Communication - EPMS{% endblock %}
{% block header %}Log Communication{% endblock %}
{% block content %}

<div class="section">
  <div style="padding:22px;">
    <form method="post">
      {% csrf_token %}

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Type</label>
          <select name="communication_type" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
            {% for value, label in type_choices %}<option value="{{ value }}" {% if value == 'phone_call' %}selected{% endif %}>{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Direction</label>
          <select name="direction" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
            <option value="">— N/A —</option>
            {% for value, label in direction_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Subject</label>
        <input type="text" name="subject" maxlength="255" placeholder="e.g. Site visit follow-up" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
      </div>

      <div style="margin-bottom:16px;">
        <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">What was discussed / email content <span style="color:var(--danger);">*</span></label>
        <textarea name="body" rows="4" required style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;"></textarea>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Project</label>
          <select name="related_project" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
            <option value="">— None —</option>
            {% for p in projects %}<option value="{{ p.pk }}" {% if preselect_project == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.project_number }} - {{ p.name }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Organisation</label>
          <select name="organisation" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
            <option value="">— None —</option>
            {% for o in organisations %}<option value="{{ o.pk }}">{{ o.legal_name }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Sender</label>
          <input type="text" name="sender" placeholder="e.g. you@elev8.com or 'Jane Smith'" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
        </div>
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Recipients</label>
          <input type="text" name="recipients" placeholder="Comma-separated" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Date/time</label>
        <input type="datetime-local" name="occurred_at" value="{{ now|date:'Y-m-d\TH:i' }}" style="padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
      </div>

      <button type="submit" class="btn">Log communication</button>
    </form>
  </div>
</div>

{% endblock %}
