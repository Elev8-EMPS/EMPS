{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width:560px; margin:20px 0;">
  <h1>Delete {{ opts.verbose_name }}: "{{ object }}"?</h1>
  <p style="color:#b91c1c; font-weight:600;">This can't be undone. You must give a reason - it's saved to the Audit Log along with your name and the time, even after the record itself is gone.</p>
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="id_audit_reason" style="display:block; font-weight:600; margin-bottom:6px;">Reason for deletion</label>
      <textarea id="id_audit_reason" name="audit_reason" rows="3" required style="width:100%; padding:8px; box-sizing:border-box;"></textarea>
    </p>
    <input type="submit" value="Yes, delete this - reason given above" class="default" style="background:#b91c1c;">
    <a href="../../" style="margin-left:12px;">Cancel</a>
  </form>
</div>
{% endblock %}
