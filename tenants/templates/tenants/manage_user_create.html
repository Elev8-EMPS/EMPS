{% extends "base.html" %}
{% block title %}New User - EPMS{% endblock %}
{% block header %}New User{% endblock %}
{% block content %}
<div class="section">
  <div style="padding:22px;">
    <form method="post">
      {% csrf_token %}
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Username <span style="color:var(--danger);">*</span></label>
          <input type="text" name="username" required style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
        </div>
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Email</label>
          <input type="email" name="email" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Temporary password <span style="color:var(--danger);">*</span></label>
        <input type="text" name="password" required style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
        <p style="font-size:12.5px; color:var(--muted); margin:4px 0 0;">Share this with them directly \u2014 they can change it once logged in.</p>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Role</label>
          <select name="role" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
            <option value="">— None —</option>
            {% for value, label in role_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Teams</label>
          <div style="padding:10px 0;">
            {% for t in teams %}
            <label style="display:block; font-size:14px; margin-bottom:4px;"><input type="checkbox" name="teams" value="{{ t.pk }}"> {{ t.name }}</label>
            {% empty %}<span style="font-size:13px; color:var(--muted);">No teams yet.</span>{% endfor %}
          </div>
        </div>
      </div>
      <button type="submit" class="btn">Create user</button>
    </form>
  </div>
</div>
{% endblock %}
