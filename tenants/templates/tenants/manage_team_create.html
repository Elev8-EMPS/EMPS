{% extends "base.html" %}
{% block title %}New Team - EPMS{% endblock %}
{% block header %}New Team{% endblock %}
{% block content %}
<div class="section">
  <div style="padding:22px;">
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:20px;">
        <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Team name <span style="color:var(--danger);">*</span></label>
        <input type="text" name="name" required style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Team manager</label>
        <select name="manager" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
          <option value="">— No manager —</option>
          {% for u in potential_managers %}<option value="{{ u.pk }}">{{ u.get_full_name|default:u.username }}</option>{% endfor %}
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Members</label>
          {% for u in users %}<label style="display:block; font-size:14px; margin-bottom:4px;"><input type="checkbox" name="members" value="{{ u.pk }}"> {{ u.username }}</label>{% endfor %}
        </div>
        <div>
          <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:4px;">Modalities (disciplines this team covers)</label>
          {% for m in modalities %}<label style="display:block; font-size:14px; margin-bottom:4px;"><input type="checkbox" name="modalities" value="{{ m.pk }}"> {{ m.name }}</label>{% empty %}<span style="font-size:13px; color:var(--muted);">No modalities yet.</span>{% endfor %}
        </div>
      </div>
      <button type="submit" class="btn">Create team</button>
    </form>
  </div>
</div>
{% endblock %}
