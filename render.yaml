# Render "Blueprint" file - lets Render create the web service and
# database together from this one file instead of clicking through
# the dashboard by hand. Optional but saves steps.
databases:
  - name: epms-db
    plan: free

services:
  - type: web
    name: epms
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn epms.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: epms-db
          property: connectionString
